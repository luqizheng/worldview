name: .NET CI

on:
  push:
    # 功能分支直接 push 也运行四平台矩阵（stacked PR 的 base 不是 master）。
    branches: [master, feat/efcore-v1-asset-geometry-invariants]
  pull_request:
    # master + stacked PR bases（新增功能分支以 PR #11 为 base，需要同样触发四平台矩阵）。
    branches: [master, feat/efcore-v1-complete-model]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: WorldView
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore WorldView.sln

      - name: Build
        run: dotnet build WorldView.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test (with slow-test diagnostics)
        run: dotnet test WorldView.sln --configuration ${{ matrix.configuration }} --no-build --no-restore -- --show-slowest-tests 20
