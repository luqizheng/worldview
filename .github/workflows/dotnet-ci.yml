name: World View .NET CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        working-directory: WorldView
        run: dotnet restore WorldView.sln

      - name: Build Debug
        working-directory: WorldView
        run: dotnet build WorldView.sln --configuration Debug --no-restore

      - name: Test Debug
        working-directory: WorldView
        run: dotnet test WorldView.sln --configuration Debug --no-build --no-restore

      - name: Build Release
        working-directory: WorldView
        run: dotnet build WorldView.sln --configuration Release --no-restore

      - name: Test Release
        working-directory: WorldView
        run: dotnet test WorldView.sln --configuration Release --no-build --no-restore
