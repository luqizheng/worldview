name: .NET CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ef-migration:
    name: Generate EF migration with the pinned CLI
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[generate-ef-migration]')
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.commit.outputs.head_sha }}
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install the pinned EF CLI
        run: dotnet tool install --global dotnet-ef --version 11.0.0

      - name: Restore EF design-time project
        working-directory: WorldView
        run: dotnet restore src/WorldView.Infrastructure/WorldView.Infrastructure.csproj

      - name: Generate the forward migration
        working-directory: WorldView
        run: dotnet ef migrations add FieldRevisionTypedMetadata --project src/WorldView.Infrastructure --startup-project src/WorldView.Infrastructure --context CoreDomainDbContext

      - name: Commit generated migration and snapshot
        id: commit
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorldView/src/WorldView.Infrastructure/Persistence/CoreDomain/EfCore/Migrations
          if git diff --cached --quiet; then
            echo "EF CLI did not produce a migration diff." >&2
            exit 1
          fi
          git commit -m "db: add typed field revision metadata migration"
          git push origin "HEAD:${PR_BRANCH}"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    needs: generate-ef-migration
    if: always() && needs.generate-ef-migration.result != 'failure' && needs.generate-ef-migration.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate-ef-migration.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        working-directory: WorldView
        run: dotnet restore WorldView.sln

      - name: Build
        working-directory: WorldView
        run: dotnet build WorldView.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        working-directory: WorldView
        run: dotnet test WorldView.sln --configuration ${{ matrix.configuration }} --no-build --no-restore
