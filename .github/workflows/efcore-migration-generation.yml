name: Generate EF Core migration

on:
  push:
    branches:
      - feat/efcore-v1-complete-model
    paths:
      - 'WorldView/src/WorldView.Infrastructure/Persistence/CoreDomain/EfCore/CoreDomainEntities.cs'
      - 'WorldView/src/WorldView.Infrastructure/Persistence/CoreDomain/EfCore/CoreDomainDbContext.cs'
      - 'WorldView/src/WorldView.Infrastructure/Persistence/CoreDomain/EfCore/CoreDomainV1ModelConfiguration.cs'
      - '.github/workflows/efcore-migration-generation.yml'

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[ef-migration-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 11.0.0

      - name: Restore
        working-directory: WorldView
        run: dotnet restore WorldView.sln

      - name: Generate migration using EF Core CLI
        working-directory: WorldView
        run: dotnet ef migrations add FieldPayloadStorage --project src/WorldView.Infrastructure/WorldView.Infrastructure.csproj --startup-project src/WorldView.Infrastructure/WorldView.Infrastructure.csproj --context WorldView.Infrastructure.Persistence.CoreDomain.EfCore.CoreDomainDbContext --output-dir Persistence/CoreDomain/EfCore/Migrations

      - name: Commit generated migration and snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorldView/src/WorldView.Infrastructure/Persistence/CoreDomain/EfCore/Migrations
          if git diff --cached --quiet; then
            echo "EF Core reported no model changes."
            exit 1
          fi
          git commit -m "chore(db): generate Field Payload migration [ef-migration-generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
