name: Generate EF Core initial migration

on:
  push:
    branches:
      - feat/efcore-v1-complete-model
    paths:
      - .github/workflows/generate-efcore-initial.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 11.0.0

      - name: Restore
        working-directory: WorldView
        run: dotnet restore src/WorldView.Infrastructure/WorldView.Infrastructure.csproj

      - name: Generate the single initial migration
        working-directory: WorldView
        run: |
          dotnet ef migrations add CoreDomainInitial \
            --context CoreDomainDbContext \
            --project src/WorldView.Infrastructure/WorldView.Infrastructure.csproj \
            --startup-project src/WorldView.Infrastructure/WorldView.Infrastructure.csproj \
            --output-dir Persistence/CoreDomain/EfCore/Migrations

      - name: Commit generated migration and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorldView/src/WorldView.Infrastructure/Persistence/CoreDomain/EfCore/Migrations
          git commit -m "feat(efcore): generate initial migration and model snapshot"
          git push origin "${GITHUB_REF_NAME}"
