# 极光港（城市地图）
# 字段定义见 `docs/数据模型规格_v0.1.md` §2。
# MVP 子集：grid 64×64 / cell_distance=2 m / time granularity=hour / 4 类图层 / 2 个建筑占位。
# 字段对照见 `.trae/specs/map-editor-mvp/spec.md` §2.2（MVP 投影说明）。

id: map_city_kael
name: 极光港
type: city

grid:
  width: 64
  height: 64
  cell_distance: 2
  distance_unit: m
  base_unit: m
  height_unit: m
  origin: { x: 0, y: 0 }
  show: true
  snap: true
  scale_label: "1 格 = 2 m"

time:
  default_granularity: hour
  min_granularity: hour
  display_format: "YYYY-MM-DD HH:mm"
  inherit_calendar: true
  allow_fuzzy: true

presentation:
  default_mode: edit
  view_mode: 2d
  theme: parchment
  show_scale_bar: true
  show_coordinates: true
  show_minimap: false

terrain_data:
  encoding: sparse
  default:
    type: plain
    move_cost: 1
    buildable: true
  cells_ref: maps/city/city_kael.terrain.yaml
  cells: []

# MVP 投影：4 类图层通过 ref 引用工程根的图层定义文件。
layers:
  - ref: ../../layers/terrain.yaml
  - ref: ../../layers/road.yaml
  - ref: ../../layers/building.yaml
  - ref: ../../layers/marker.yaml

city_refs: []

# MVP 投影：建筑以 inline 列表形式登记（数据模型规格 §2 的 building_refs 走
# 独立文件；MVP 不做建筑独立文件化，见 spec.md §2.5 + §2 顶部投影说明）。
# at: [x, y] 是城市地图网格坐标（0 ≤ x,y < 64）；map_id 等于本地图 id。
buildings:
  - id: b_kael_house_01
    type: house
    at: [20, 30]
    map_id: map_city_kael
  - id: b_kael_tower_01
    type: tower
    at: [32, 32]
    map_id: map_city_kael
