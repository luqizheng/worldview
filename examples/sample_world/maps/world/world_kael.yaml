# 艾瑟兰大陆（世界地图）
# 字段定义见 `docs/数据模型规格_v0.1.md` §2。
# MVP 子集：grid / time / presentation / terrain_data / layers / city_refs。
# 字段对照见 `.trae/specs/map-editor-mvp/spec.md` §2.2（MVP 投影说明）。

id: map_world_kael
name: 艾瑟兰大陆
type: world

grid:
  width: 64
  height: 48
  cell_distance: 10
  distance_unit: km
  base_unit: m
  height_unit: m
  origin: { x: 0, y: 0 }
  show: true
  snap: true
  scale_label: "1 格 = 10 km"

time:
  default_granularity: month
  min_granularity: day
  display_format: "YYYY-MM-DD"
  inherit_calendar: true
  allow_fuzzy: true

presentation:
  default_mode: edit
  view_mode: 2d
  theme: parchment
  show_scale_bar: true
  show_coordinates: true
  show_minimap: false

terrain_data:
  encoding: sparse
  default:
    type: plain
    move_cost: 1
    buildable: true
  cells_ref: maps/world/world_kael.terrain.yaml
  cells: []

# MVP 投影：图层通过 ref 引用工程根的 4 类图层定义文件，
# 图层本体的 id/name/type/visible/opacity/z_order 见 `layers/<file>.yaml`。
layers:
  - ref: ../../layers/terrain.yaml
  - ref: ../../layers/road.yaml
  - ref: ../../layers/building.yaml
  - ref: ../../layers/marker.yaml

# 世界地图特有的"城市标记"（双击下钻入口）：
# - id: 工程内稳定标识（与城市地图 id 一致便于引用）
# - map_ref: 相对工程根的路径（不得含 ..）
# - entry: 进入城市地图时的初始焦点（城市坐标）
city_refs:
  - id: city_kael
    name: 极光港
    x: 32
    y: 24
    entry: { x: 32, y: 24 }
    map_ref: maps/city/city_kael.yaml
    population: 24000
    faction: fac_merchant_league
    notes: |
      艾瑟兰大陆东南海岸的最大港口；面向永风洋，
      是创世历 1042 年「断潮夜」事件的发生地。

building_refs: []
